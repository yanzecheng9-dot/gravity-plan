<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0a0b">
<title>引力计划 · 字体预览</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@900&family=ZCOOL+QingKe+HuangYou&family=ZCOOL+XiaoWei&text=%E5%BC%95%E5%8A%9B%E8%AE%A1%E5%88%92&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#0a0a0b; color:#f2efe9; font-family:-apple-system,"PingFang SC",sans-serif; padding:28px 20px 40px }
  h1 { font-size:15px; font-weight:600; color:#a49f96; margin:0 0 6px }
  p.note { color:#a49f96; font-size:13px; line-height:1.7; margin:0 0 26px }
  .sample { border:1px solid rgba(242,239,233,.16); border-radius:18px; padding:20px 18px 16px; margin-bottom:16px; background:rgba(242,239,233,.04) }
  .tag { font-size:12px; color:#ff4d1c; letter-spacing:.14em; margin-bottom:8px }
  .word { font-size:64px; line-height:1.2; color:#f2efe9 }
  .f1 { font-family:"ZCOOL QingKe HuangYou", sans-serif }
  .f2 { font-family:"Ma Shan Zheng", cursive }
  .f3 { font-family:"Noto Serif SC", serif; font-weight:900 }
  .f4 { font-family:"ZCOOL XiaoWei", serif }
  .desc { color:#a49f96; font-size:13px; margin-top:8px; line-height:1.6 }
</style>
</head>
<body>
  <h1>「引力计划」四个候选字体</h1>
  <p class="note">都是只加载这四个字的小字体文件，不会拖慢网站。看好哪个，把编号告诉我就行。如果四个看起来都一样，那是字体没加载出来，也告诉我。</p>
  <div class="sample"><div class="tag">1 · 站酷黄油体</div><div class="word f1">引力计划</div><div class="desc">海报展示字，笔画带切角，力量感强，跟海报横幅最搭。</div></div>
  <div class="sample"><div class="tag">2 · 马善政书法体</div><div class="word f2">引力计划</div><div class="desc">手写毛笔字，有笔锋和飞白，个性最强，但跟天文科技感稍远。</div></div>
  <div class="sample"><div class="tag">3 · 思源宋体 特粗</div><div class="word f3">引力计划</div><div class="desc">还是宋体，但加到最粗，碑刻感和分量感出来了，稳重。</div></div>
  <div class="sample"><div class="tag">4 · 站酷小薇体</div><div class="word f4">引力计划</div><div class="desc">细笔画文艺宋体，清秀，有设计感但气势弱一点。</div></div>
</body>
</html>
